<div class="container mt-5">
    <ul class="list-group w-50 mx-auto">
        @for (producto of productos; track producto) {
            <li class="list-group-item text-center" style="font-size: 1.5rem">
                {{producto.descripcion}} - {{producto.precio}}
            </li>
        }
    </ul>

    <form (submit)="agregarProducto($event, descripcionInput.value, precioInput.value)" class="w-50 mx-auto mt-4">
        <div class="mb-3">
            <label for="descripcionInput" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="descripcionInput" #descripcionInput>
        </div>
        <div class="mb-3">
            <label for="precioInput" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precioInput" #precioInput>
        </div>
        <button type="submit" class="btn btn-primary">Agregar Producto</button>
    </form>
</div>
